[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uncp"
version = "0.1.0"
description = "Unified Network Control Platform - Recon Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-generativeai>=0.8.0",
    "python-nmap>=0.7.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.8.0",
    "shodan>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "config*", "db*"]
