[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uncp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings",
    "motor",
    "fastapi",
    "uvicorn[standard]",
    "google-genai",
    "httpx",
    "python-dotenv",
    "pymongo",
    # Recon agent deps
    "python-nmap>=0.7.1",
    "shodan>=1.31.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Lateral agent deps (optional at runtime — tools.py degrades gracefully without them)
    "boto3>=1.34.0",
    "pymysql>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--color=yes -v"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
