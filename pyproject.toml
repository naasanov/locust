[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "src"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings",
    "motor",
    "fastapi",
    "uvicorn[standard]",
    "google-generativeai",
    "httpx",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
