services:
  juice-shop:
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"

  demo-vuln:
    image: python:3.12-alpine
    command: ["sh", "-c", "cd /srv && python -m http.server 8000"]
    volumes:
      - ./tests/fixtures/demo-vuln:/srv:ro
    ports:
      - "8000:8000"

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: juice_db
      MYSQL_USER: juice_admin
      MYSQL_PASSWORD: s3cr3tpass!
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ujuice_admin", "-ps3cr3tpass!"]
      interval: 5s
      timeout: 3s
      retries: 10
